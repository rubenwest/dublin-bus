<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Trébol (Dublín): tres lóbulos redondeados + tallo -->
  <g fill="#2f9e44">
    <!-- lóbulo superior -->
    <rect x="6" y="1" width="4" height="2"/><rect x="7" y="0" width="2" height="1"/>
    <!-- lóbulo izquierdo -->
    <rect x="2" y="4" width="4" height="2"/><rect x="3" y="3" width="2" height="1"/><rect x="3" y="6" width="2" height="1"/>
    <!-- lóbulo derecho -->
    <rect x="10" y="4" width="4" height="2"/><rect x="11" y="3" width="2" height="1"/><rect x="11" y="6" width="2" height="1"/>
    <!-- centro que une los tres -->
    <rect x="6" y="3" width="4" height="3"/>
  </g>
  <rect x="7" y="6" width="2" height="3" fill="#1c6b2e"/>
  <!-- Bus 8-bit (ámbar, como los sprites de la app) -->
  <rect x="2" y="10" width="12" height="4" fill="#f2b705"/>
  <rect x="2" y="10" width="12" height="1" fill="#ffd23f"/>
  <rect x="4" y="11" width="8" height="1" fill="#bfe9ff"/>
  <rect x="3" y="14" width="2" height="1" fill="#2f2f37"/>
  <rect x="11" y="14" width="2" height="1" fill="#2f2f37"/>
</svg>
