<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Llegadas · Dublín</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Llegadas de autobús en Dublín en tiempo real, sobre el feed GTFS-Realtime de la NTA.">
  <meta name="theme-color" content="#0e1014">
  <!-- El .ico primero (fallback) y el SVG despues: Chromium prefiere el SVG,
       y el ?v fuerza a refrescar el favicon cacheado tras el cambio de icono. -->
  <link rel="icon" href="favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Fuentes retro: pixel para números y títulos, monoespaciada legible para
       el texto. Progresivas: si no cargan (offline), caen a monospace del
       sistema y la app sigue leyéndose. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>

  <!--
    Analítica de tráfico con GoatCounter: sin cookies (no hace falta banner de
    consentimiento), gratis y open source. Da visitas, país, referrer, navegador
    y tamaño de pantalla — el "quién entra y desde dónde". Panel en
    https://dublin-bus.goatcounter.com

    Script externo (gc.zgo.at), async para no bloquear el render. El service
    worker no lo cachea: gc.zgo.at es otro origen y no casa con los patrones de
    ngsw-config, así que offline simplemente no cuenta y la app sigue igual.
  -->
  <script data-goatcounter="https://dublin-bus.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
