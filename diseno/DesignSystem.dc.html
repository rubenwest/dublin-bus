<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#0e1014; --panel:#171a21; --panel2:#1f232c; --hard:#05060a; --line:#2b303b;
      --text:#e8eaed; --dim:#98a0ac;
      --bus:#f2b705; --bus-hi:#ffd23f; --luas:#c026d3; --luas-hi:#e879f9;
      --vivo:#35c6a5; --malo:#ff6b6b; --malo-bg:#2a1618;
    }
    .light{
      --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceef2; --hard:#b9bec7; --line:#d9dce2;
      --text:#16181d; --dim:#5f6672;
      --bus:#f2b705; --bus-hi:#ffcf1f; --luas:#b4179f; --luas-hi:#d94ec2;
      --vivo:#0e9e80; --malo:#c62828; --malo-bg:#fdeaea;
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .scr{ width:390px; min-height:840px; background:var(--bg); color:var(--text);
      font-family:"IBM Plex Mono",ui-monospace,monospace; padding:18px; }
    .px{ font-family:"Press Start 2P",monospace; }
    .wordmark{ font-family:"Press Start 2P",monospace; font-size:12px; letter-spacing:1px; line-height:1.5; }
    .lbl{ font-family:"Press Start 2P",monospace; font-size:8px; letter-spacing:1px; color:var(--dim); text-transform:uppercase; }
    .card{ background:var(--panel); border:3px solid var(--hard); box-shadow:4px 4px 0 var(--hard); padding:14px; }
    .sw{ height:52px; border:3px solid var(--hard); box-shadow:3px 3px 0 var(--hard); display:flex; align-items:flex-end; padding:5px; }
    .sw span{ font-family:"IBM Plex Mono",monospace; font-size:9px; background:rgba(0,0,0,.45); color:#fff; padding:1px 4px; }
    .sprite{ width:34px;height:26px; display:inline-block; background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:pixelated;
      background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2012'%20shape-rendering%3D'crispEdges'%3E%3Crect%20x%3D'1'%20y%3D'2'%20width%3D'14'%20height%3D'7'%20fill%3D'%23f2b705'%2F%3E%3Crect%20x%3D'1'%20y%3D'2'%20width%3D'14'%20height%3D'1'%20fill%3D'%23ffd23f'%2F%3E%3Crect%20x%3D'2'%20y%3D'4'%20width%3D'12'%20height%3D'2'%20fill%3D'%23bfe9ff'%2F%3E%3Crect%20x%3D'4'%20y%3D'4'%20width%3D'1'%20height%3D'2'%20fill%3D'%23f2b705'%2F%3E%3Crect%20x%3D'7'%20y%3D'4'%20width%3D'1'%20height%3D'2'%20fill%3D'%23f2b705'%2F%3E%3Crect%20x%3D'10'%20y%3D'4'%20width%3D'1'%20height%3D'2'%20fill%3D'%23f2b705'%2F%3E%3Crect%20x%3D'1'%20y%3D'7'%20width%3D'14'%20height%3D'1'%20fill%3D'%23c98a00'%2F%3E%3Crect%20x%3D'2'%20y%3D'9'%20width%3D'2'%20height%3D'2'%20fill%3D'%232f2f37'%2F%3E%3Crect%20x%3D'11'%20y%3D'9'%20width%3D'2'%20height%3D'2'%20fill%3D'%232f2f37'%2F%3E%3C%2Fsvg%3E");}
    .sprite.tram{ background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2012'%20shape-rendering%3D'crispEdges'%3E%3Crect%20x%3D'8'%20y%3D'0'%20width%3D'1'%20height%3D'2'%20fill%3D'%239aa3af'%2F%3E%3Crect%20x%3D'5'%20y%3D'0'%20width%3D'6'%20height%3D'1'%20fill%3D'%239aa3af'%2F%3E%3Crect%20x%3D'2'%20y%3D'2'%20width%3D'12'%20height%3D'7'%20fill%3D'%23c026d3'%2F%3E%3Crect%20x%3D'2'%20y%3D'2'%20width%3D'12'%20height%3D'1'%20fill%3D'%23e879f9'%2F%3E%3Crect%20x%3D'3'%20y%3D'4'%20width%3D'10'%20height%3D'2'%20fill%3D'%23bfe9ff'%2F%3E%3Crect%20x%3D'7'%20y%3D'4'%20width%3D'1'%20height%3D'2'%20fill%3D'%23c026d3'%2F%3E%3Crect%20x%3D'2'%20y%3D'8'%20width%3D'12'%20height%3D'1'%20fill%3D'%2386198f'%2F%3E%3Crect%20x%3D'1'%20y%3D'9'%20width%3D'14'%20height%3D'1'%20fill%3D'%239aa3af'%2F%3E%3Crect%20x%3D'4'%20y%3D'10'%20width%3D'1'%20height%3D'1'%20fill%3D'%232f2f37'%2F%3E%3Crect%20x%3D'11'%20y%3D'10'%20width%3D'1'%20height%3D'1'%20fill%3D'%232f2f37'%2F%3E%3C%2Fsvg%3E");}
    .blip{ width:16px;height:16px; border:2px solid var(--hard); }
    .chip{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; padding:3px 8px; border:2px solid var(--line); background:var(--panel2); color:var(--text); }
    a{color:var(--vivo);} a:hover{color:var(--bus);}
  </style>
</helmet>

<div class="scr {{themeClass}}">
  <div class="wordmark" style="color:var(--text)">DUBLIN<br>BUS · RADAR</div>
  <div class="lbl" style="margin:6px 0 18px">Sistema de diseño · 8-bit</div>

  <div class="lbl" style="margin-bottom:8px">Paleta</div>
  <div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;">
    <div class="sw" style="background:var(--bus)"><span>#f2b705 BUS</span></div>
    <div class="sw" style="background:var(--luas)"><span>#c026d3 LUAS</span></div>
    <div class="sw" style="background:var(--vivo)"><span>EN VIVO</span></div>
    <div class="sw" style="background:var(--panel)"><span>PANEL</span></div>
    <div class="sw" style="background:var(--bg)"><span>FONDO</span></div>
    <div class="sw" style="background:var(--malo)"><span>NO PARA</span></div>
  </div>

  <div class="lbl" style="margin:22px 0 8px">Tipografía</div>
  <div class="card">
    <div class="px" style="font-size:30px; color:var(--vivo); line-height:1">04</div>
    <div class="px" style="font-size:9px; margin-top:10px; color:var(--text)">CERCA DE TI</div>
    <div style="font-size:13px; color:var(--dim); margin-top:10px; line-height:1.5">
      Pixel para números y títulos.<br>Monoespaciada para leer los nombres largos.
    </div>
  </div>

  <div class="lbl" style="margin:22px 0 8px">Vehículos</div>
  <div style="display:flex; gap:14px;">
    <div class="card" style="flex:1; display:flex; align-items:center; gap:10px;">
      <span class="blip" style="background:var(--bus)"></span>
      <span class="sprite"></span>
      <span style="font-weight:600; font-size:13px">BUS</span>
    </div>
    <div class="card" style="flex:1; display:flex; align-items:center; gap:10px;">
      <span class="blip" style="background:var(--luas)"></span>
      <span class="sprite tram"></span>
      <span style="font-weight:600; font-size:13px">LUAS</span>
    </div>
  </div>

  <div class="lbl" style="margin:22px 0 8px">Componentes</div>
  <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <span class="chip">39A</span>
    <span class="chip" style="border-color:var(--vivo); color:var(--vivo)">E2</span>
    <span class="chip" style="background:var(--bus); border-color:var(--hard); color:#241a00">FAV ★</span>
    <button class="px" style="font-size:9px; color:var(--bg); background:var(--vivo); border:3px solid var(--hard); box-shadow:3px 3px 0 var(--hard); padding:10px 12px; cursor:pointer">VER</button>
  </div>
</div>

<script data-dc-script data-props='{"tema":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Tema"}}'>
class Component extends DCLogic {
  renderVals(){ return { themeClass: (this.props.tema === 'light') ? 'light' : '' }; }
}
</script>
</body>
</html>
